<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <!-- Librería oficial de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <div class="card" id="formLogin">
        <h2>🔐 Iniciar Sesión</h2>
        
        <div class="input-group">
            <label for="email">Correo electrónico</label>
            <input type="email" id="email" placeholder="correo@ejemplo.com">
        </div>
        
        <div class="input-group">
            <label for="pass">Contraseña</label>
            <input type="password" id="pass" placeholder="Tu contraseña">
        </div>
        
        <button id="btnEntrar">Entrar</button>
        <div id="mensaje" class="mensaje"></div>
    </div>

    <div class="card bienvenida" id="paginaBienvenida">
        <h2>✅ ¡Bienvenido!</h2>
        <p>Has iniciado sesión correctamente</p>
        <p><strong id="usuarioMostrado"></strong></p>
        <button class="btn-salir" id="btnSalir">Cerrar Sesión</button>
    </div>

    <script src="codigo.js"></script>
</body>
</html>
